services:
  db:
    image: postgres:16-alpine
    container_name: selfdev-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: selfdev
      POSTGRES_PASSWORD: selfdev
      POSTGRES_DB: selfdev
    volumes:
      - selfdev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfdev -d selfdev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: selfdev-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://selfdev:selfdev@db:5432/selfdev
      HOST: 0.0.0.0
      PORT: 3000
      RUST_LOG: selfdev_backend=info,tower_http=info,sqlx=warn
    depends_on:
      db:
        condition: service_healthy

volumes:
  selfdev_pgdata:
